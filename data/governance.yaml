boardTermNotes: >-
  Per 2025-03-25 minutes: Craig had one year left on his term, Greg had
  two. Per the 2026-03-31 annual meeting: one board seat was up for
  election; Craig was re-elected over a Hunter Behling nomination, 4
  ayes. Officer roles (President/VP/Treasurer/Secretary) are reassigned
  separately from board-seat elections, per the 2026-05-26 minutes above.
  Board history goes back further than the 2025-26 record: the board was
  originally formed via a Jan 2024 election notice to all homeowners
  (Canyon Breeze had no board before that). Brady has been continuously
  involved since at least 2022 (per an old sign-removal dispute thread)
  and was confirmed as VP as far back as Jun 2024. At the 2025-03-12
  annual meeting, Craig indicated the board needed to "elect someone to
  replace Brady" — Brady's exact status/reasoning at that moment isn't
  fully clear from the record, but he was still active on the board
  immediately after and has been continuously since.
