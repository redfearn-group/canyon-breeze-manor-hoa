# Public — board officer roster and entity status are standard HOA
# governance transparency (already distributed to all homeowners via
# minutes), not sensitive the way delinquency/violation specifics are.
entityName: Canyon Breeze Manor Owners Association
entityType: Non-profit corporation (Utah)
entityStatusNotes: >-
  Properly organized as a non-profit with the State Department of
  Corporations as of the 2025-06-24 meeting. Prior to that, there was
  confusion/discrepancy between the CC&Rs, Articles of Incorporation, and
  state filings (LLC vs. Inc) noted as far back as 2025-04-29, and the
  Association was not registered with the State HOA Registry at that
  time.
openComplianceItems:
  - The State HOA Advisory Board reportedly requires a separate
    registration in addition to the Association's current State
    registration (raised 2025-09-30) — status as of the last minutes on
    file is still "Craig looking into the complexity," not resolved.
  - There is no formal process for reviewing/approving exterior
    alteration (ACC) requests — confirmed directly by a board member's
    own words in Mar 2026 ("we don't have a process for this at all
    right now"). Requests have been handled ad hoc by email so far.
  - D&O vs. structures-only insurance coverage was raised as an open
    question in the 2025-03-25 minutes and hasn't been confirmed
    resolved in any later record.
  - A community newsletter with "corrected verbiage" has been under
    discussion since early 2026 but hadn't gone out as of the last
    record reviewed.
officers:
  - name: Brady Redfearn
    role: President
    since: '2026-05-26'
    priorRole: Vice President (through at least 2025-11-10)
  - name: Hunter Behling
    role: Vice President
    since: '2026-05-26'
  - name: Greg Robbins
    role: Treasurer
    since: '2026-05-26'
    priorRole: Secretary (through at least 2025-11-10)
  - name: Craig Jorgensen
    role: Secretary
    since: '2026-05-26'
    priorRole: President (through at least 2025-11-10)
boardTermNotes: >-
  Per 2025-03-25 minutes: Craig had one year left on his term, Greg had
  two. Per the 2026-03-31 annual meeting: one board seat was up for
  election; Craig was re-elected over a Hunter Behling nomination, 4
  ayes. Officer roles (President/VP/Treasurer/Secretary) are reassigned
  separately from board-seat elections, per the 2026-05-26 minutes above.
